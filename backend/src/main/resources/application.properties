server.port=${PORT:8080}
spring.application.name=oficina

# Banco: tudo por variável de ambiente (sem valores fixos de senha)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Esquema só por migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# CORS: só em desenvolvimento (ex.: http://localhost:5173)
app.cors.origens=${CORS_ORIGENS:}

# Uploads (logo e fundo) ficam num volume montado pelo Dokploy
app.uploads.dir=${UPLOADS_DIR:./uploads}

# Acesso
app.jwt.secret=${JWT_SECRET}
# true em produção (HTTPS). Em desenvolvimento local sem HTTPS use COOKIE_SECURE=false
app.cookie.secure=${COOKIE_SECURE:true}
# Primeiro funcionário com acesso (só é criado se ainda não existir nenhum)
app.admin.nome=${ADMIN_NOME:Atendente}
app.admin.login=${ADMIN_LOGIN:}
app.admin.senha=${ADMIN_SENHA:}

# Upload: limite do servidor (logo 2 MB e fundo 5 MB são conferidos no serviço)
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=7MB
