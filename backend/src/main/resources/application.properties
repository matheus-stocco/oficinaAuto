server.port=${PORT:8080}
spring.application.name=oficina

# Banco: tudo por variável de ambiente (sem valores fixos de senha)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Esquema só por migrations
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# CORS: só em desenvolvimento (ex.: http://localhost:5173)
app.cors.origens=${CORS_ORIGENS:}

# Uploads (logo e fundo) ficam num volume montado pelo Dokploy
app.uploads.dir=${UPLOADS_DIR:./uploads}
